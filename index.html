<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에이아이:음 | 재능봉사캠프</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="landing">
    <!-- 배경 요소 -->
    <div class="sun"><div class="core"></div><div class="rays"></div></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>

    <!-- 로봇들 -->
    <div class="robot r1">
      <div class="ant"></div>
      <div class="head"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="bodybox"><span class="heart">🤖</span></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>
    <div class="robot r2">
      <div class="ant"></div>
      <div class="head"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="bodybox"><span class="heart">🤖</span></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>
    <div class="robot r3">
      <div class="ant"></div>
      <div class="head"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="bodybox"><span class="heart">💚</span></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>

    <!-- 말풍선 -->
    <div class="speech p1">🤖 AI 친구랑 같이 놀자!</div>
    <div class="speech p2">🌱 ESG는 지구를 지키는 것!</div>

    <!-- 타이틀 -->
    <div class="title-wrap">
      <span class="title-kicker">한국장학재단 재능봉사캠프 · 5일간의 신나는 모험</span>
      <h1 class="title-main"><span class="grad">에이아이:음</span></h1>
      <p class="title-sub">초등학생들과 함께 배우는 <b>AI</b> & <b>ESG</b> 재능봉사캠프</p>
      <a href="menu.html" class="btn-bounce">캠프 시작하기 🚀</a>
    </div>

    <!-- 학교 일러스트 + 학생들 -->
    <div class="scene">
      <div class="school">
        <div class="roof"></div>
        <div class="clock"></div>
        <div class="body">
          <div class="win w1"></div>
          <div class="win w2"></div>
          <div class="win w3"></div>
          <div class="win w4"></div>
          <div class="door"></div>
        </div>
        <div class="bush b1"></div>
        <div class="bush b2"></div>
        <div class="flag"><span class="cloth">AI</span></div>
      </div>

      <div class="student st1">
        <div class="hair"></div>
        <div class="face"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
        <div class="shirt"></div>
        <div class="arms"><i></i><i></i></div>
        <div class="legs"><i></i><i></i></div>
      </div>
      <div class="student st2">
        <div class="hair"></div>
        <div class="face"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
        <div class="shirt"></div>
        <div class="arms"><i></i><i></i></div>
        <div class="legs"><i></i><i></i></div>
      </div>
      <div class="student st3">
        <div class="hair"></div>
        <div class="face"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
        <div class="shirt"></div>
        <div class="arms"><i></i><i></i></div>
        <div class="legs"><i></i><i></i></div>
      </div>
    </div>

    <!-- 잔디 -->
    <div class="grass"></div>

    <!-- 하단 문구 -->
    <div class="credit"><span class="x">에이아이:음</span><i></i><span>신안초등학교</span></div>
  </div>
  <script src="js/lock.js"></script>
</body>
</html>
