<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>백민주 선생님 OX 퀴즈 | 에이아이:음</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <div class="top-bar">
    <a href="../quiz.html" class="back">◀ 선생님 선택</a>
    <span class="logo">에이아이<span>:</span>음</span>
  </div>

  <div class="page">
    <span class="badge">무작위 OX 퀴즈</span>
    <h1><span class="grad">백민주</span> 선생님 퀴즈!</h1>
    <p class="desc">민주쌤에 대해 얼마나 알고 있는지 O/X로 맞혀봐요! 버튼을 눌러 정답을 확인하세요.</p>

    <div class="ox-wrap">
      <div class="ox-card" data-answer="O">
        <div class="ox-q">
          <span class="ox-num">Q1</span>
          <p>선생님은 고양이를 키우고 있는 집사다</p>
        </div>
        <div class="ox-btns">
          <button type="button" class="ox-btn o" data-pick="O">O</button>
          <button type="button" class="ox-btn x" data-pick="X">X</button>
        </div>
        <p class="ox-result"></p>
      </div>

      <div class="ox-card" data-answer="O">
        <div class="ox-q">
          <span class="ox-num">Q2</span>
          <p>선생님은 부산에서 태어났다</p>
        </div>
        <div class="ox-btns">
          <button type="button" class="ox-btn o" data-pick="O">O</button>
          <button type="button" class="ox-btn x" data-pick="X">X</button>
        </div>
        <p class="ox-result"></p>
      </div>

      <div class="ox-card" data-answer="X">
        <div class="ox-q">
          <span class="ox-num">Q3</span>
          <p>선생님은 MBTI 극강의 F다</p>
        </div>
        <div class="ox-btns">
          <button type="button" class="ox-btn o" data-pick="O">O</button>
          <button type="button" class="ox-btn x" data-pick="X">X</button>
        </div>
        <p class="ox-result"></p>
      </div>

      <div class="ox-card" data-answer="X">
        <div class="ox-q">
          <span class="ox-num">Q4</span>
          <p>선생님의 키는 170cm가 넘는다</p>
        </div>
        <div class="ox-btns">
          <button type="button" class="ox-btn o" data-pick="O">O</button>
          <button type="button" class="ox-btn x" data-pick="X">X</button>
        </div>
        <p class="ox-result"></p>
      </div>

      <div class="ox-card" data-answer="O">
        <div class="ox-q">
          <span class="ox-num">Q5</span>
          <p>민주쌤은 이번에 졸업을 한다</p>
        </div>
        <div class="ox-btns">
          <button type="button" class="ox-btn o" data-pick="O">O</button>
          <button type="button" class="ox-btn x" data-pick="X">X</button>
        </div>
        <p class="ox-result"></p>
      </div>
    </div>

    <a href="../quiz.html" class="link-back">선생님 선택으로 돌아가기</a>
  </div>

  <script>
    (function () {
      document.querySelectorAll(".ox-card").forEach(function (card) {
        var answer = card.getAttribute("data-answer");
        var result = card.querySelector(".ox-result");
        card.querySelectorAll(".ox-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (card.classList.contains("answered")) return;
            card.classList.add("answered");
            btn.classList.add("picked");
            if (btn.getAttribute("data-pick") === answer) {
              card.classList.add("correct");
              result.textContent = "🎉 축하해! 정답이야~";
            } else {
              card.classList.add("wrong");
              result.textContent = "😅 안타깝지만 틀렸구먼~";
              card.querySelector('.ox-btn[data-pick="' + answer + '"]').classList.add("reveal");
            }
          });
        });
      });
    })();
  </script>
  <script src="../../js/lock.js"></script>
</body>
</html>
